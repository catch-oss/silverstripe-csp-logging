---
Name: csplog
After:
  - '#logging'
  - '#loggingformatters'
  - '#dev-logging'
  - '#live-logging'
---
SilverStripe\Core\Injector\Injector:
  Camspiers\CSP\Logger:
    type: singleton
    class: Camspiers\CSP\Logger
    constructor:
      - 'Camspiers.CSP'
    calls:
      LogFileHandler: [pushHandler, ['%$CSPLogHandler']]
  CSPLogHandler:
    class: Monolog\Handler\StreamHandler
    constructor:
      - '../log/csp.log'
      - 200
    properties:
      Formatter: '%$Camspiers\CSP\LogFormatter'
